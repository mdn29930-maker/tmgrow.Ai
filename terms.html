<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="index,follow" />
  <title>Terms of Service — TM GROW</title>
  <meta name="description" content="TM GROW Terms of Service: eligibility, tasks, rewards, wallets, verification, security and all platform rules." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Manrope:wght@500;600;700;800&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/app.css?v=2025-10-12-39" />
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <style>
    body { background: var(--bg); }
    #legal { max-width: 920px; margin: 0 auto; padding: 18px 16px 60px; }
    .legal-fallback { padding: 40px 18px; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <div id="legal"><div class="legal-fallback">Loading the Terms of Service…</div></div>
  <noscript><div class="legal-fallback">JavaScript is disabled. Open the app and read the terms at <a href="/#/terms">/#/terms</a>.</div></noscript>

  <script src="/vendor/supabase.js?v=2025-10-12-39"></script>
  <script type="module">
    import { renderTerms } from '/src/views/worker.js?v=2025-10-12-39';
    import { loadPublicData } from '/src/lib/store.js?v=2025-10-12-39';

    const root = document.getElementById('legal');

    /* Load the public settings first so the page states the same minimum
       withdrawal, fee threshold and support address the app uses, instead of
       the hardcoded fallbacks renderTerms would otherwise fall back to. */
    try {
      await loadPublicData();
    } catch (e) {
      console.warn('[tmgrow:terms] public settings unavailable', e);
    }

    try {
      await renderTerms(root);
      root.querySelectorAll('a[href^="#/"]').forEach((a) => {
        a.setAttribute('href', '/' + a.getAttribute('href'));
      });
    } catch (e) {
      root.innerHTML = '<div class="legal-fallback">The terms could not be rendered here. Open <a href="/#/terms">the in-app Terms of Service</a>.</div>';
      console.error('[tmgrow:terms]', e);
    }
  </script>
</body>
</html>
